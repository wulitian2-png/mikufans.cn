<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 30vh;
        }

        .error-img {
            height: 35vh;
            width: auto;
            max-width: 90vw;
            image-rendering: auto;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="404-loli.png" alt="404 您所寻找的loli不存在" class="error-img">
    </div>

</body>
</html>
